<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - GrowigoDash</title>
    <link rel="shortcut icon" href="assets/images/logo/icon.svg" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/extensions/bootstrap-5/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="assets/extensions/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Main Style -->
    <link rel="stylesheet" href="assets/css/main/app.css">

    <!-- Page Specific Style -->
    <link rel="stylesheet" href="assets/css/pages/auth-login.css">
</head>

<body>

    <div class="container-fluid p-0" id="auth-login">
        <div class="row g-0">
            <!-- Left Side: Branding -->
            <div class="col-lg-6 col-12 order-lg-1 order-1">
                <div class="auth-sidebar">
                    <div class="login-logo-container">
                        <img src="assets/images/logo/logo.svg" alt="GrowigoDash Logo" class="login-logo">
                    </div>
                    <div class="login-branding-text">
                        <h1>Manage your<br>business with full control.</h1>
                        <p>GrowigoDash offers integrated tools to monitor and optimize your business efficiency.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="col-lg-6 col-12 order-lg-2 order-2">
                <div class="auth-content">
                    <div class="auth-form-wrapper">
                        <!-- Mobile Logo (Visible only on small screens) -->
                        <div class="text-center d-lg-none mb-4">
                            <img src="assets/images/logo/logo.svg" alt="GrowigoDash Logo" class="login-logo-mobile"
                                style="width: 150px;">
                        </div>

                        <h1 class="login-title">Sign In</h1>
                        <p class="login-subtitle">Welcome back! Please enter your details.</p>

                        <form action="index.html">
                            <div class="form-group mb-4">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i
                                            class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control border-start-0 ps-0" id="email"
                                        value="ari.fazrian@growigodash.com" placeholder="name@company.com" required>
                                </div>
                            </div>

                            <div class="form-group mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label for="password" class="form-label mb-0">Password</label>
                                    <a href="#" class="small text-muted">Forgot Password?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i
                                            class="bi bi-shield-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 border-end-0 ps-0"
                                        value="12345678" id="password" placeholder="••••••••" required>
                                    <span class="input-group-text bg-white border-start-0" id="toggle-password"
                                        style="cursor: pointer;">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label text-muted small" for="rememberMe">
                                    Keep me logged in
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 shadow-sm mb-4">Sign In</button>

                            <!-- Social Login -->
                            <div class="auth-divider">Or continue with</div>
                            <button type="button" class="btn btn-google w-100">
                                <i class="bi bi-google"></i> Sign In with Google
                            </button>
                        </form>

                        <div class="mt-5 text-center small">
                            <p class="text-muted">Don't have an account? <a href="auth-register.html"
                                    class="fw-bold">Create Account</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="assets/extensions/bootstrap-5/js/bootstrap.bundle.min.js"></script>
    <!-- Page Specific Script -->
    <script src="assets/js/pages/auth-login.js"></script>
</body>

</html>
