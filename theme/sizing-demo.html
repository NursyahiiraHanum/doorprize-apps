<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Sizes Demo - GrowigoDash</title>
    <link rel="shortcut icon" href="assets/images/logo/icon.svg" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/extensions/bootstrap-5/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="assets/extensions/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Main Styles -->
    <link rel="stylesheet" href="assets/css/main/app.css">
    <link rel="stylesheet" href="assets/extensions/perfect-scrollbar/perfect-scrollbar.css">
    <link rel="stylesheet" href="assets/css/main/dashboard.css">
</head>

<body>
    <div class="container my-5">
        <h1 class="mb-4">Button & Input Sizing System</h1>

        <!-- Button Sizes -->
        <div class="card mb-4">
            <div class="card-header">
                <h4 class="card-title mb-0">Button Sizes</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">4 distinct sizes: Small (32px), Medium (42px), Large (52px), Extra Large (62px)
                </p>
                <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                    <button class="btn btn-primary btn-sm">Small</button>
                    <button class="btn btn-primary">Medium</button>
                    <button class="btn btn-primary btn-lg">Large</button>
                    <button class="btn btn-primary btn-xl">Extra Large</button>
                </div>
            </div>
        </div>

        <!-- Input Sizes -->
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">Input Sizes</h4>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Small (32px)</label>
                        <input type="text" class="form-control form-control-sm" placeholder="Small input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Medium (42px)</label>
                        <input type="text" class="form-control" placeholder="Medium input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Large (52px)</label>
                        <input type="text" class="form-control form-control-lg" placeholder="Large input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Extra Large (62px)</label>
                        <input type="text" class="form-control form-control-xl" placeholder="Extra large input">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/extensions/bootstrap-5/js/bootstrap.bundle.min.js"></script>
</body>

</html>
